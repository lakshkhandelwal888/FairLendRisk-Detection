stages:
  clean:
    cmd: py src/clean.py
    deps:
    - data/raw/Loan_Default.csv
    - src/clean.py
    outs:
    - data/processed/clean.csv
  prepare:
    cmd: py src/prepare.py
    deps:
    - data/processed/clean.csv
    - src/config.py
    - src/prepare.py
    outs:
    - data/processed/test.csv
    - data/processed/train.csv
  train:
    cmd: py src/train.py
    deps:
    - data/processed/test.csv
    - data/processed/train.csv
    - src/config.py
    - src/train.py
    metrics:
    - reports/metrics.json:
        cache: false
